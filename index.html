<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti - Te Amo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <!-- Three.js Base -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    
    <!-- Controles de cámara interactivos -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Post-procesado para el efecto Bloom (El brillo del SOL) -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <!-- CSS2DRenderer para que el texto y las flores floten sincronizados en 3D -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <!-- Modal Dedicatoria -->
    <div id="dedication-modal">
        <div class="modal-content">
            <button id="close-modal">&times;</button>
            <div class="modal-body">
                <h2>Para ti, mi amor</h2>
                <p>Un universo lleno de luz y girasoles</p>
                <p>Te amo.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
